name: NetEase Music Card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netease-music-card
  cancel-in-progress: true

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate music card
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
        run: python3 .github/scripts/netease.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add musicCard.svg README.md
          git diff --staged --quiet || (git commit -m "chore: update NetEase music card" && git push)